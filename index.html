  :root{
    --bg:#F2F3F0; --panel:#FFFFFF; --ink:#111312; --ink-soft:#5F6862;
    --line:#DFE3DE; --danger:#FF2A33; --ok:#16A34A;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0A0B0A; --panel:#171A18; --ink:#F4F5F2; --ink-soft:#A3ACA6; --line:#2B302D; --ok:#22C55E; }
  }
  :root[data-theme="dark"]{ --bg:#0A0B0A; --panel:#171A18; --ink:#F4F5F2; --ink-soft:#A3ACA6; --line:#2B302D; --ok:#22C55E; }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{overscroll-behavior:none; -webkit-tap-highlight-color:transparent;}
  button, .pill, .mult label, .badge, .logo, .leather-title{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  /* light mode on a home-screen iPhone: dark strip so the white status-bar text stays readable */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) body::before{content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:#111312; z-index:50;}
  }
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 500px at 0% -10%, rgba(227,38,46,.22), transparent 60%),
      radial-gradient(700px 420px at 100% 5%, rgba(227,38,46,.08), transparent 60%),
      radial-gradient(900px 520px at 90% 105%, rgba(22,163,74,.20), transparent 60%),
      var(--bg);
    background-repeat:no-repeat;
  }
  .num{font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; font-weight:800;}

  .wrap{max-width:640px; margin:0 auto; padding:32px 20px 80px;}
  header{margin-bottom:26px; display:flex; align-items:center; gap:4px;}
  .logo{flex:0 0 auto; filter:drop-shadow(0 6px 14px rgba(0,0,0,.25)); width:auto; height:78px;}
  h1{margin:0;}
  .leather-title{
    display:block; width:min(388px, calc(100vw - 132px)); height:auto;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));
  }
  .leather-title text{ font-family:'Baloo 2','Helvetica Neue',Arial,sans-serif; }

  .row{
    position:relative; background:linear-gradient(180deg, var(--panel), color-mix(in srgb, var(--panel) 92%, #000 3%));
    border:1px solid var(--line); border-radius:20px; padding:18px;
    margin-bottom:20px; display:flex; gap:14px; align-items:flex-start;
    box-shadow:
      0 1px 0 rgba(255,255,255,.7) inset,
      0 22px 34px -20px var(--shadow, rgba(0,0,0,.35)),
      0 3px 8px -2px rgba(0,0,0,.15);
  }

  .badge{
    flex:0 0 auto; width:50px; height:50px; border-radius:50%; background:var(--track);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#fff; margin-top:2px; position:relative; overflow:hidden;
    box-shadow:
      0 6px 14px -3px var(--shadow, rgba(0,0,0,.5)),
      inset 0 2px 3px rgba(255,255,255,.55),
      inset 0 -6px 10px rgba(0,0,0,.25);
  }
  .badge::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 28% 22%, rgba(255,255,255,.5), transparent 32%);
  }
  .badge span{
    position:relative; z-index:1;
    text-shadow:
      0 1px 0 rgba(0,0,0,.35),
      0 2px 3px rgba(0,0,0,.45);
    -webkit-text-stroke:0.6px rgba(0,0,0,.30);
  }

  .ver{font-size:12px; margin-left:4px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); vertical-align:1px;}
  .title-row{display:flex; align-items:flex-end; gap:0; flex-wrap:wrap;}
  .byline{margin:0 0 30px; font-size:15px; line-height:1.2; color:var(--ink-soft); white-space:nowrap;}
  .body{flex:1; min-width:0;}
  .btn{min-height:44px;}
  .mult label{min-height:40px; font-size:13px;}
  .a2hs{display:flex; align-items:center; gap:10px; margin:-10px 0 18px; padding:10px 12px; border-radius:14px; font-size:14px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-soft);}
  .a2hs[hidden]{display:none;}
  .a2hs b{color:var(--ink);}
  .a2hs svg{vertical-align:-2px; color:var(--ink);}
  .a2hs button{margin-left:auto; flex:0 0 auto; width:32px; height:32px; border:none; border-radius:50%; background:var(--bg); color:var(--ink); font-size:20px; line-height:1; cursor:pointer;}
  .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px;}
  .name{font-size:15px; font-weight:800;}
  .side{flex:0 0 64px; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .phase{font-size:12px; line-height:1.3; color:var(--ink-soft); text-align:center; white-space:pre-line;}
  .btn.primary{min-width:92px;}
  .phase.work{color:var(--ok); font-weight:700;}
  .phase.done{color:var(--danger); font-weight:700;}
  .clock{font-size:30px; line-height:1; letter-spacing:.5px; transition:color .3s; white-space:nowrap; text-shadow:0 1px 0 rgba(255,255,255,.5);}

  .custom-dur{display:flex; align-items:center; gap:4px; margin-bottom:10px;}
  .custom-dur .cf{display:flex; flex-direction:column; align-items:flex-start;}
  .custom-dur label{font-size:10px; color:var(--ink-soft);}
  .custom-dur input{
    width:44px; border:1px solid var(--line); border-radius:7px; background:var(--bg);
    color:var(--ink); padding:7px 6px; font-size:16px; font-family:inherit; width:52px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.14);
  }
  .custom-dur .colon{font-size:16px; font-weight:700; margin-top:12px; color:var(--ink-soft);}

  .pill{
    position:relative; height:44px; border-radius:999px; padding:5px;
    background:var(--track); display:flex; align-items:center;
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,.35),
      inset 0 -1px 0 rgba(255,255,255,.25),
      0 1px 0 rgba(255,255,255,.5);
    cursor:pointer; touch-action:none; user-select:none;
  }
  .pill-fill{
    height:100%; min-width:26px; border-radius:999px;
    background:linear-gradient(180deg,#ffffff,#eef0f5 55%,#dfe2ea);
    box-shadow:
      0 2px 4px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -2px 3px rgba(0,0,0,.08);
    transition:width .2s linear;
  }
  .pill.dragging .pill-fill{transition:none;}
  .row .badge span{color:var(--on-track); text-shadow:0 1px 0 rgba(255,255,255,.5); -webkit-text-stroke:0;}
  .row .btn.primary, .row .mult label.active{color:var(--on-track);}
  .row.ending .clock{color:var(--danger);}
  .row.ending .pill{animation:endpulse 1s ease-in-out infinite;}
  @keyframes endpulse{ 0%,100%{filter:none;} 50%{filter:brightness(1.18) drop-shadow(0 0 8px rgba(255,42,51,.75));} }
  @media (prefers-reduced-motion: reduce){ .row.ending .pill{animation:none;} }
  .pill.done{ background:linear-gradient(90deg, var(--danger), #FF7A7F); }

  .mult{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .mult label{
    display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft);
    border:1px solid var(--line); border-radius:9px; padding:6px 10px; cursor:pointer;
    background:var(--panel); box-shadow:0 2px 4px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .mult input{cursor:pointer; accent-color:var(--track-solid, #16A34A);}
  .mult label.active{
    color:#fff; border-color:transparent; font-weight:700; background:var(--track);
    box-shadow:0 4px 10px -2px var(--shadow, rgba(0,0,0,.5)), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.2);
  }

  .total{font-size:12px; color:var(--ink-soft); margin-top:10px;}
  .total b{color:var(--ink); font-weight:700;}

  .controls{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .btn{
    border:none; background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 18px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
    box-shadow:0 3px 0 var(--line), 0 6px 10px -4px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 0 0 var(--line), 0 2px 4px -2px rgba(0,0,0,.25); }
  .btn.primary{
    background:var(--track); color:#fff;
    box-shadow:0 4px 0 color-mix(in srgb, var(--track-solid, #B91C1C) 70%, #000), 0 8px 14px -4px var(--shadow, rgba(0,0,0,.5)), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn.primary:active{ box-shadow:0 0 0 transparent, 0 2px 6px -2px var(--shadow, rgba(0,0,0,.4)); }
  .btn.ghost{ background:var(--bg); }

  @media (max-width:480px){
    .title-row{flex-direction:column; align-items:flex-start; gap:0;}
    .byline{margin:-14px 0 0 6px;}
    .wrap{padding:24px 14px 60px;}
    .row{padding:14px; gap:10px;}
    .side{flex-basis:52px;}
    .top{flex-direction:column; align-items:flex-start; gap:2px;}
    .clock{font-size:44px; letter-spacing:1px;}
    .name{white-space:nowrap;}
  }
</style>
</head>
<body>

<script>
(function(){
  const rowsEl = document.getElementById('rows');
  const DEFAULT_MULTS = [2,5,10];

  const timers = [
    { id:0, name:'Short Play', base:30,   rounds:1, round:1, phase:'idle', remaining:30,
      track:'linear-gradient(90deg,#4ADE80,#16A34A)', shadow:'rgba(22,163,74,.5)', solid:'#15803D', custom:false, ink:'#04240F',
      mults:[2,5,10,20,30,60] },
    { id:3, name:'Long Play', base:60,   rounds:1, round:1, phase:'idle', remaining:60,
      track:'linear-gradient(90deg,#F87171,#DC2626)', shadow:'rgba(220,38,38,.5)', solid:'#B91C1C', custom:true, ink:'#2A0304',
      mults:[2,5,10,20,30,60] }
  ];
  timers.forEach(t=>{ t.running=false; t.last=null; });

  const STORE_KEY = 'timerbars-duo-state';
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(timers.map(t=>({
        id:t.id, base:t.base, rounds:t.rounds, round:t.round, phase:t.phase,
        remaining:t.remaining, running:t.running, last:t.last
      }))));
    }catch(e){ /* storage unavailable */ }
  }
  function loadState(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if(!Array.isArray(saved)) return;
      for(const s of saved){
        const t = timers.find(x=>x.id===s.id);
        if(!t) continue;
        if(t.custom && s.base > 0) t.base = s.base;
        if(t.mults.includes(s.rounds) || s.rounds===1) t.rounds = s.rounds;
        t.round = Math.max(1, Math.min(t.rounds, s.round|0 || 1));
        t.phase = s.phase==='work' ? 'work' : 'idle';
        t.remaining = typeof s.remaining==='number' ? s.remaining : t.base;
        t.running = !!s.running && t.phase==='work' && typeof s.last==='number';
        t.last = t.running ? s.last : null;
        if(t.phase==='idle'){ t.remaining = t.base; t.round = 1; }
      }
    }catch(e){ /* ignore bad data */ }
  }
  loadState();
  window.addEventListener('pagehide', saveState);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveState(); });

  let ticking = false;
  let pipWin = null;
  const raf = cb => (pipWin || window).requestAnimationFrame(cb);
  let audioCtx = null;

  // Bell sound: a few out-of-tune partials (like a real bell) that ring out and fade.
  const BELL_PARTIALS = [
    { r:0.50, g:0.35, d:1.00 },  // hum
    { r:1.00, g:1.00, d:0.80 },  // strike note
    { r:1.19, g:0.45, d:0.55 },  // tierce (gives the "bell" colour)
    { r:1.50, g:0.30, d:0.45 },  // quint
    { r:2.00, g:0.55, d:0.40 },  // nominal
    { r:2.74, g:0.25, d:0.25 },
    { r:3.76, g:0.15, d:0.15 },
    { r:5.40, g:0.08, d:0.08 }
  ];
  let bellBus = null;
  function bell(freq, length, volume, when){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      if(!bellBus){
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -6; comp.knee.value = 6; comp.ratio.value = 3;
        comp.attack.value = 0.002; comp.release.value = 0.25;
        comp.connect(audioCtx.destination);
        bellBus = comp;
      }
      const t0 = audioCtx.currentTime + (when || 0);
      const master = audioCtx.createGain();
      master.gain.value = volume;
      master.connect(bellBus);
      for(const p of BELL_PARTIALS){
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const dur = length * p.d;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * p.r, t0);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(p.g * 0.40, t0 + 0.004);      // hard strike
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);        // long ring-out
        osc.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      }
    }catch(e){ /* audio not available, ignore */ }
  }

  function unlockAudio(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state !== 'running') audioCtx.resume();
      const b = audioCtx.createBuffer(1, 1, 22050), src = audioCtx.createBufferSource();
      src.buffer = b; src.connect(audioCtx.destination); src.start(0);
    }catch(e){}
  }
  document.addEventListener('touchend', unlockAudio, {passive:true});
  document.addEventListener('pointerdown', unlockAudio, {passive:true});

  // start: one light bell tap
  function dingStart(){ bell(1976, 1.4, 0.6); }
  // end: boxing-ring style bell, three quick strikes
  function dingEnd(){
    bell(1320, 2.6, 0.9, 0);
    bell(1320, 2.6, 0.9, 0.28);
    bell(1320, 3.2, 0.9, 0.56);
  }

  function fmt(s){
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = s%60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }

  function startPause(t){
    if(t.phase === 'idle') t.phase = 'work';
    if(t.phase === 'done') return;
    t.running = !t.running;
    if(t.running) dingStart(); else syncWakeLock();
    t.last = Date.now();
    render();
    ensureTick();
    saveState();
  }

  function reset(t){
    t.round = 1; t.rounds = 1; t.phase = 'idle'; t.remaining = t.base; t.running = false;
    render();
    syncWakeLock();
    saveState();
  }

  function setMultiplier(t, m){
    t.rounds = (t.rounds === m) ? 1 : m;
    if(t.phase === 'idle') t.round = 1;
    render();
    saveState();
  }

  function setCustomDuration(t, h, m, s){
    const clamp = (v, max)=> Math.min(max, Math.max(0, Math.floor(v) || 0));
    h = clamp(h, 99); m = clamp(m, 59); s = clamp(s, 59);
    const total = Math.max(1, h*3600 + m*60 + s);
    t.base = total;
    if(t.phase === 'idle') t.remaining = total;
    render();
    saveState();
  }

  let wakeLock = null;
  async function syncWakeLock(){
    const need = timers.some(t=>t.running);
    try{
      if(need && !wakeLock && 'wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      } else if(!need && wakeLock){
        await wakeLock.release(); wakeLock = null;
      }
    }catch(e){ /* not supported or denied */ }
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') syncWakeLock();
  });

  function ensureTick(){
    syncWakeLock();
    if(ticking) return;
    ticking = true;
    raf(tick);
  }

  function tick(){
    const now = Date.now();
    let anyRunning = false, finished = false;
    for(const t of timers){
      if(!t.running) continue;
      anyRunning = true;
      const dt = (now - t.last)/1000;
      t.last = now;
      t.remaining -= dt;
      let ended = false, lateBy = 0;
      while(t.running && t.remaining <= 0){
        ended = true; lateBy = -t.remaining;
        if(t.round >= t.rounds){
          t.round = 1; t.phase = 'idle'; t.remaining = t.base; t.running = false;
          finished = true;
        } else {
          t.round += 1;
          t.remaining += t.base;
        }
      }
      if(ended){
        if(lateBy < 3) dingEnd();   // no surprise ding for something that ended long ago
        saveState();
      }
    }
    updateDom();
    if(finished && pipWin && !timers.some(t=>t.phase==='work')){ pipWin.close(); return; }
    if(anyRunning){ raf(tick); } else { ticking = false; syncWakeLock(); }
  }

  function pctOf(t){
    return t.base>0 ? Math.min(100, Math.max(0, 100*(1 - t.remaining/t.base))) : 0;
  }

  function seekPill(t, pillEl, clientX){
    const rect = pillEl.getBoundingClientRect();
    let ratio = rect.width>0 ? (clientX - rect.left) / rect.width : 0;
    ratio = Math.min(1, Math.max(0, ratio));
    t.remaining = t.base * (1 - ratio);
    if(t.phase === 'idle' || t.phase === 'done') t.phase = 'work';
    updateDom();
  }

  function render(){
    rowsEl.innerHTML = '';
    timers.forEach((t, idx)=>{
      const row = document.createElement('div');
      row.className = 'row' + (t.phase==='work' ? ' active' : '');
      row.style.setProperty('--on-track', t.ink);
      row.dataset.id = t.id;
      row.style.setProperty('--shadow', t.shadow);
      row.style.setProperty('--track-solid', t.solid);
      const pct = t.phase==='idle' ? 0 : pctOf(t);

      const durH = Math.floor(t.base/3600), durM = Math.floor((t.base%3600)/60), durS = t.base%60;

      row.innerHTML = `
        <div class="side">
          <div class="badge" style="--track:${t.track}"><span>${String(idx+1).padStart(2,'0')}</span></div>
          <div class="phase" data-role="phase"></div>
        </div>
        <div class="body">
          <div class="top">
            <div>
              <div class="name">${t.name}</div>
            </div>
            <div class="clock num" data-role="clock">${fmt(t.remaining)}</div>
          </div>
          ${t.custom ? `
          <div class="custom-dur">
            <div class="cf"><label>hh</label><input type="number" min="0" max="99" step="1" inputmode="numeric" pattern="[0-9]*" data-role="ch" value="${durH}" ${t.phase!=='idle'?'disabled':''}></div>
            <div class="colon">:</div>
            <div class="cf"><label>mm</label><input type="number" min="0" max="59" step="1" inputmode="numeric" pattern="[0-9]*" data-role="cm" value="${durM}" ${t.phase!=='idle'?'disabled':''}></div>
            <div class="colon">:</div>
            <div class="cf"><label>ss</label><input type="number" min="0" max="59" step="1" inputmode="numeric" pattern="[0-9]*" data-role="cs" value="${durS}" ${t.phase!=='idle'?'disabled':''}></div>
          </div>` : ''}
          <div class="pill ${t.phase==='done'?'done':''}" data-role="pill" style="--track:${t.track}">
            <div class="pill-fill" data-role="pillfill" style="width:${pct}%"></div>
          </div>
          <div class="mult" data-role="mult">
            ${(t.mults||DEFAULT_MULTS).map(m => `<label data-m="${m}" style="--track:${t.track}"><input type="checkbox" data-role="mchk" value="${m}" ${t.rounds===m?'checked':''}> x${m}</label>`).join('')}
          </div>
          <div class="total" data-role="total"></div>
          <div class="controls">
            <button class="btn primary" data-role="startpause" style="--track:${t.track}"></button>
            <button class="btn ghost" data-role="reset">Reset</button>
          </div>
        </div>
      `;
      rowsEl.appendChild(row);

      let justDragged = false;
      row.querySelector('[data-role="startpause"]').addEventListener('click', ()=>{
        if(justDragged) return;
        startPause(t);
      });
      row.querySelector('[data-role="reset"]').addEventListener('click', ()=> reset(t));
      row.querySelectorAll('[data-role="mchk"]').forEach(cb=>{
        cb.addEventListener('change', ()=> setMultiplier(t, +cb.value));
      });

      const pillEl = row.querySelector('[data-role="pill"]');
      let dragging = false;
      pillEl.addEventListener('pointerdown', e=>{
        e.preventDefault();
        e.stopPropagation();
        dragging = true;
        pillEl.classList.add('dragging');
        t.running = true;
        t.last = Date.now();
        seekPill(t, pillEl, e.clientX);
        updateRowLabels(row, t);
        ensureTick();
        try{ pillEl.setPointerCapture(e.pointerId); }catch(err){}
      });
      const onMove = e=>{
        if(!dragging) return;
        e.preventDefault();
        seekPill(t, pillEl, e.clientX);
      };
      const endDrag = e=>{
        if(!dragging) return;
        dragging = false;
        pillEl.classList.remove('dragging');
        try{ pillEl.releasePointerCapture(e.pointerId); }catch(err){}
        justDragged = true;
        setTimeout(()=>{ justDragged = false; }, 250);
        updateRowLabels(row, t);
        saveState();
      };
      pillEl.addEventListener('pointermove', onMove);
      pillEl.addEventListener('pointerup', endDrag);
      pillEl.addEventListener('pointercancel', endDrag);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      if(t.custom){
        const chEl = row.querySelector('[data-role="ch"]');
        const cmEl = row.querySelector('[data-role="cm"]');
        const csEl = row.querySelector('[data-role="cs"]');
        [chEl,cmEl,csEl].forEach(el=>{
          el.addEventListener('change', ()=> setCustomDuration(t, +chEl.value||0, +cmEl.value||0, +csEl.value||0));
        });
      }

      updateRowLabels(row, t);
    });
  }

  function updateRowLabels(row, t){
    const phaseEl = row.querySelector('[data-role="phase"]');
    const startBtn = row.querySelector('[data-role="startpause"]');
    const totalEl = row.querySelector('[data-role="total"]');
    if(!phaseEl || !startBtn) return;
    let text = '';
    if(t.phase === 'idle') text = t.rounds>1 ? ('rep 1 of '+t.rounds) : '';
    else if(t.phase === 'work'){
      const state = t.running ? 'running' : 'paused';
      text = t.rounds>1 ? (state+'\nrep '+t.round+' of '+t.rounds) : state;
    }
    else text = 'done';
    phaseEl.textContent = text;
    phaseEl.className = 'phase ' + t.phase;
    startBtn.textContent = t.phase==='done' ? 'Done' : (t.running ? 'Pause' : (t.phase==='idle' ? 'Start' : 'Resume'));
    startBtn.disabled = t.phase==='done';
    row.querySelectorAll('.mult label').forEach(l=>{
      l.classList.toggle('active', +l.dataset.m === t.rounds);
    });
    if(totalEl){
      totalEl.innerHTML = t.rounds>1
        ? `Total: <b>${fmt(t.base*t.rounds)}</b>`
        : `Total: <b>${fmt(t.base)}</b>`;
    }
  }

  function updateDom(){
    timers.forEach(t=>{
      const row = rowsEl.querySelector(`.row[data-id="${t.id}"]`);
      if(!row) return;
      row.classList.toggle('active', t.phase==='work');
      row.classList.toggle('ending', t.running && t.phase==='work' && t.remaining <= 10);
      const clock = row.querySelector('[data-role="clock"]');
      if(clock) clock.textContent = fmt(t.remaining);
      const fill = row.querySelector('[data-role="pillfill"]');
      if(fill) fill.style.width = (t.phase==='idle' ? 0 : pctOf(t)) + '%';
      const pill = row.querySelector('[data-role="pill"]');
      if(pill) pill.classList.toggle('done', t.phase==='done');
      updateRowLabels(row, t);
    });
  }

  (function(){
    const tip = document.getElementById('a2hs');
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    let dismissed = false;
    try{ dismissed = localStorage.getItem('maxgym-a2hs-dismissed') === '1'; }catch(e){}
    if(!standalone && !dismissed) tip.hidden = false;
    document.getElementById('a2hsClose').addEventListener('click', ()=>{
      tip.hidden = true;
      try{ localStorage.setItem('maxgym-a2hs-dismissed','1'); }catch(e){}
    });
  })();

  render();
  if(timers.some(t=>t.running)) ensureTick();
})();
</script>
<script>
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js')); }
</script>
</body>
</html>
